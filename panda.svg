<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <style>
    .bob { animation: bob 3s ease-in-out infinite; transform-origin: 120px 130px; }
    .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    .wave { animation: wave 1.2s ease-in-out infinite; transform-origin: 196px 182px; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
    @keyframes wave { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-25deg) } }
  </style>

  <!-- bamboo -->
  <rect x="24" y="40" width="12" height="190" rx="5" fill="#4CAF50"/>
  <rect x="24" y="90" width="12" height="4" fill="#2E7D32"/>
  <rect x="24" y="150" width="12" height="4" fill="#2E7D32"/>
  <path d="M36 92 q22 -14 34 -6 q-20 4 -34 10z" fill="#66BB6A"/>
  <path d="M24 150 q-14 -16 -6 -30 q2 18 6 26z" fill="#66BB6A"/>

  <g class="bob">
    <!-- body -->
    <ellipse cx="120" cy="190" rx="62" ry="44" fill="#ffffff" stroke="#222" stroke-width="3"/>
    <ellipse cx="120" cy="200" rx="34" ry="24" fill="#f3f3f3"/>
    <!-- feet -->
    <ellipse cx="86" cy="228" rx="20" ry="11" fill="#222"/>
    <ellipse cx="154" cy="228" rx="20" ry="11" fill="#222"/>
    <!-- left arm -->
    <ellipse cx="66" cy="182" rx="15" ry="26" fill="#222" transform="rotate(20 66 182)"/>
    <!-- right arm waving -->
    <g class="wave">
      <ellipse cx="180" cy="160" rx="14" ry="26" fill="#222" transform="rotate(-35 180 160)"/>
    </g>

    <!-- ears -->
    <circle cx="74" cy="56" r="22" fill="#222"/>
    <circle cx="166" cy="56" r="22" fill="#222"/>
    <!-- head -->
    <ellipse cx="120" cy="100" rx="64" ry="56" fill="#ffffff" stroke="#222" stroke-width="3"/>
    <!-- eye patches -->
    <ellipse cx="94" cy="98" rx="17" ry="22" fill="#222" transform="rotate(-25 94 98)"/>
    <ellipse cx="146" cy="98" rx="17" ry="22" fill="#222" transform="rotate(25 146 98)"/>
    <!-- eyes -->
    <g class="blink"><circle cx="97" cy="96" r="7" fill="#fff"/><circle cx="99" cy="95" r="3.5" fill="#222"/></g>
    <g class="blink"><circle cx="143" cy="96" r="7" fill="#fff"/><circle cx="141" cy="95" r="3.5" fill="#222"/></g>
    <!-- cheeks -->
    <ellipse cx="82" cy="124" rx="9" ry="5" fill="#FFB6C1" opacity="0.8"/>
    <ellipse cx="158" cy="124" rx="9" ry="5" fill="#FFB6C1" opacity="0.8"/>
    <!-- nose and mouth -->
    <ellipse cx="120" cy="118" rx="8" ry="5.5" fill="#222"/>
    <path d="M120 123 v6 M120 129 q-7 7 -13 1 M120 129 q7 7 13 1" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
